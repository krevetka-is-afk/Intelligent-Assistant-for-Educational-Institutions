# term-paper project configuration
# Источник истины для метаданных проекта: docs/technical-specification-for-IAfEI/ТЗ-инд-растворов/data.typ
# Положите основной ТЗ в директорию inputs.tz_dir
# Если нужен командный ПМИ, положите командное ТЗ в ./input/tz-team
# Положите архивы кода или папки репозиториев в директорию inputs.code_dir
# В inputs.notes_file можно добавить дополнительные требования, скриншоты и замечания
project:
    name: 'Разработка интеллектуального ассистента для образовательных учреждений'
    english_name: Development of an Intelligent Assistant for Educational Institutions
    code: "05.09"
    summary: Программа предназначена для интеллектуальной поддержки студентов и преподавателей НИУ ВШЭ и других вузов — ответы на вопросы об учебных планах, регламентах, сроках и процедурах на основе внутренних документов. Система базируется на RAG-архитектуре и использует локальную векторную базу (ChromaDB), языковую модель (Ollama/qwen2.5:3b), эмбеддинги (ruBERT-tiny2) и интерфейсы Telegram/Web. Разработка выполнена командой трёх студентов НИУ ВШЭ в рамках курсового проекта по направлению 09.03.04 «Программная инженерия».
    type: RAG chatbot
student:
    name: С. Е. Растворов
    group: БПИ236
students:
