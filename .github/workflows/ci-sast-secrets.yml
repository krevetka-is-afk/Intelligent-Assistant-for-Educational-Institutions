name: Security - SAST & Secrets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/SAST-SECRETS

      - name: Semgrep scan (SARIF)
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --error --config p/ci --config /src/security/semgrep/rules.yml \
              --sarif --output /src/EVIDENCE/SAST-SECRETS/semgrep.sarif --metrics=off

      - name: Gitleaks detect
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" gitleaks/gitleaks:latest \
            detect --no-banner --no-git --config=/repo/security/.gitleaks.toml \
              --source=/repo --report-format=json \
              --report-path=/repo/EVIDENCE/SAST-SECRETS/gitleaks.json

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SAST-SECRETS_EVIDENCE
          path: EVIDENCE/SAST-SECRETS

      - name: Fail on SAST or secret findings
        if: steps.semgrep.outcome == 'failure' || steps.gitleaks.outcome == 'failure'
        run: exit 1
