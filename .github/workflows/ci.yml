name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    name: SAST and secret scanning
    uses: ./.github/workflows/ci-sast-secrets.yml

  sbom-sca:
    name: SBOM and dependency scanning
    uses: ./.github/workflows/ci-sbom-sca.yml

  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.12". Exercise the
        # declared lower bound and the current supported minor release.
        python-version: ["3.12", "3.13"]
    env:
      DATABASE_URL: "${{ secrets.DEV_DATABASE_URL || 'sqlite:///data/ci_test.sqlite' }}"
      TEST_DB_URL: "${{ secrets.DEV_TEST_DB_URL || 'sqlite:///data/ci_test.sqlite' }}"
      API_KEY: ${{ secrets.API_KEY }}
      APP_ENV: ${{ secrets.APP_ENV }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint and format checks
        run: |
          uv run ruff check .
          uv run black --check .
          uv run isort --check-only .

      - name: Tests
        run: uv run -m pytest -q -rs -p no:cacheprovider

      - name: Pre-commit (all files)
        if: matrix.python-version == '3.12'
        env:
          # Gitleaks is a blocking dedicated security job below. Skipping it
          # here avoids a second, network-dependent Go bootstrap.
          SKIP: no-commit-to-branch,gitleaks
        run: uv run pre-commit run --all-files

  package-and-artifacts:
    name: Coverage, package, and container scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "${{ secrets.DEV_DATABASE_URL || 'sqlite:///data/ci_test.sqlite' }}"
      TEST_DB_URL: "${{ secrets.DEV_TEST_DB_URL || 'sqlite:///data/ci_test.sqlite' }}"
      API_KEY: ${{ secrets.API_KEY }}
      APP_ENV: ${{ secrets.APP_ENV }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Tests with coverage
        run: |
          mkdir -p reports
          uv run -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=74 -q --junitxml=reports/junit-coverage.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
            reports/junit-*.xml
          if-no-files-found: warn

      - name: Build package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run --with build python -m build

      - name: Upload build package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          config: security/hadolint.yaml

      - name: Build image for scan
        run: docker build -t intelligent-assistant:ci .

      - name: Scan image for High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: intelligent-assistant:ci
          trivy-config: security/trivy.yaml
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  compose-config:
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate development and production Compose files
        shell: bash
        run: |
          compose_env="$(mktemp)"
          trap 'rm -f "$compose_env"' EXIT
          seccomp_profile_path="$GITHUB_WORKSPACE/security/seccomp/default.json"
          test -r "$seccomp_profile_path"
          cat > "$compose_env" <<'EOF'
          POSTGRES_DB=ci_database
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          BOT_TOKEN=123456:ci-token
          API_KEY=ci-api-key
          TELEGRAM_SERVICE_KEY=ci-telegram-service-key
          APP_ENV=ci
          LOG_LEVEL=INFO
          DOCKER_IMAGE_NAME=example.invalid/intelligent-assistant
          DOCKER_IMAGE_TAG=ci
          DOCUMENTS_HOST_PATH=./data_and_documents
          SERVER_PUBLISH_PORT=8000
          EOF
          ENV_FILE="$compose_env" docker compose --env-file "$compose_env" config -q
          ENV_FILE="$compose_env" SECCOMP_PROFILE_PATH="$seccomp_profile_path" \
            docker compose --env-file "$compose_env" \
            -f deployment/production/compose.yaml config -q

  deploy-staging:
    name: Deploy to Staging
    needs: [sast-secrets, sbom-sca, lint-and-test, package-and-artifacts, compose-config]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.example' }}
    env:
      STAGING_URL: "${{ secrets.STAGING_URL || vars.STAGING_URL || 'https://staging.example' }}"
      DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: python-package
          path: dist

      - name: Inspect package bundle
        run: ls -lah dist

      - name: Deploy to staging (simulation)
        run: |
          echo "Deploying to staging environment..."
          echo "Mock deployment completed to $STAGING_URL"

      - name: Health check staging
        run: echo "Performing health check..."
